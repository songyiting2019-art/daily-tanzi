<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">电饭煲温度变化与自动切换</title>
  <desc id="desc">温度先升到沸腾平台，水减少后锅底温度再次上升，越过阈值后切到保温。</desc>
  <rect width="800" height="420" rx="28" fill="#f6f1e8"/>
  <text x="48" y="58" fill="#3e3529" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="26" font-weight="700">温度曲线给出的“饭熟了”信号</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <path d="M86 326H738M86 326V98" fill="none" stroke="#6a6054" stroke-width="3"/>
    <path d="M87 290C145 267 172 215 221 190C285 157 396 183 510 171C558 166 579 124 618 108C657 93 693 90 733 87" fill="none" stroke="#c75a3b" stroke-width="8" stroke-linecap="round"/>
    <path d="M89 181H518" stroke="#8a8176" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M89 137H589" stroke="#37837a" stroke-width="3" stroke-dasharray="8 8"/>
    <circle cx="589" cy="120" r="12" fill="#37837a"/>
    <path d="M589 120v170" stroke="#37837a" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="98" y="171" fill="#6a6054" font-size="17">接近沸点的平台</text>
    <text x="98" y="129" fill="#24665f" font-size="17">约103°C动作点（典型简单机型）</text>
    <text x="176" y="359" fill="#3e3529" font-size="19">升温</text>
    <text x="345" y="359" fill="#3e3529" font-size="19">水吸热、汽化</text>
    <text x="584" y="359" fill="#3e3529" font-size="19">水减少</text>
    <text x="674" y="359" fill="#24665f" font-size="19" font-weight="700">保温</text>
    <rect x="536" y="208" width="186" height="78" rx="16" fill="#e5f2ef"/>
    <text x="629" y="239" text-anchor="middle" fill="#24665f" font-size="18" font-weight="700">锅底再次升温</text>
    <text x="629" y="266" text-anchor="middle" fill="#24665f" font-size="17">温控机构释放开关</text>
  </g>
</svg>
