<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">一万元现金购买库存的复式记录</title>
  <desc id="desc">库存增加一万元，现金减少一万元，两项同时记录，总资产不变。</desc>
  <rect width="800" height="420" rx="28" fill="#edf3f6"/>
  <text x="48" y="58" fill="#253b47" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="26" font-weight="700">一笔采购，记录价值的两个方向</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="58" y="116" width="246" height="142" rx="22" fill="#fff" stroke="#4d859e" stroke-width="3"/>
    <text x="181" y="158" text-anchor="middle" fill="#253b47" font-size="22" font-weight="700">库存</text>
    <text x="181" y="209" text-anchor="middle" fill="#2e7d61" font-size="34" font-weight="750">+ 10,000</text>
    <text x="181" y="239" text-anchor="middle" fill="#607682" font-size="17">资源增加</text>
    <rect x="496" y="116" width="246" height="142" rx="22" fill="#fff" stroke="#4d859e" stroke-width="3"/>
    <text x="619" y="158" text-anchor="middle" fill="#253b47" font-size="22" font-weight="700">现金</text>
    <text x="619" y="209" text-anchor="middle" fill="#bd5848" font-size="34" font-weight="750">− 10,000</text>
    <text x="619" y="239" text-anchor="middle" fill="#607682" font-size="17">资源减少</text>
    <path d="M319 186h162" stroke="#607682" stroke-width="5" stroke-linecap="round"/>
    <path d="m468 173 15 13-15 13" fill="none" stroke="#607682" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="165" text-anchor="middle" fill="#607682" font-size="17">现金换成存货</text>
    <rect x="157" y="302" width="486" height="66" rx="18" fill="#dcebf1"/>
    <text x="400" y="343" text-anchor="middle" fill="#253b47" font-size="21" font-weight="700">总资产变化：10,000 − 10,000 = 0</text>
  </g>
</svg>
