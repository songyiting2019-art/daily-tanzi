<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">自动喷淋头局部热触发示意</title>
  <desc id="desc">火源上方热气流使最近喷淋头开启，远处喷淋头保持关闭。</desc>
  <rect width="960" height="560" rx="36" fill="#eef1ec"/>
  <text x="65" y="70" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2924">同一根水管，不同喷头各自感受温度</text>
  <line x1="100" y1="140" x2="860" y2="140" stroke="#315f54" stroke-width="24" stroke-linecap="round"/>
  <g fill="#d8d0c4" stroke="#1d2924" stroke-width="4">
    <path d="M240 140 V214 H210 L240 254 270 214 H240"/>
    <path d="M480 140 V214 H450 L480 254 510 214 H480"/>
    <path d="M720 140 V214 H690 L720 254 750 214 H720"/>
  </g>
  <circle cx="240" cy="212" r="11" fill="#c56e4f"/>
  <circle cx="480" cy="212" r="11" fill="#c56e4f"/>
  <circle cx="720" cy="212" r="11" fill="#c56e4f"/>
  <g stroke="#4b84a3" stroke-width="8" stroke-linecap="round">
    <line x1="480" y1="250" x2="410" y2="358"/>
    <line x1="480" y1="250" x2="480" y2="374"/>
    <line x1="480" y1="250" x2="550" y2="358"/>
    <line x1="480" y1="250" x2="365" y2="324"/>
    <line x1="480" y1="250" x2="595" y2="324"/>
  </g>
  <path d="M430 468 C385 430 411 390 446 371 C438 409 469 406 480 354 C541 411 538 455 494 487 Z" fill="#d85b3f"/>
  <path d="M466 470 C446 445 459 427 479 409 C484 439 504 443 496 473 Z" fill="#f2b84b"/>
  <path d="M425 386 C400 342 414 298 447 270" fill="none" stroke="#c56e4f" stroke-width="10" stroke-dasharray="10 12"/>
  <path d="M535 386 C560 342 546 298 513 270" fill="none" stroke="#c56e4f" stroke-width="10" stroke-dasharray="10 12"/>
  <text x="163" y="310" font-family="sans-serif" font-size="23" fill="#1d2924">未达到动作温度</text>
  <text x="397" y="310" font-family="sans-serif" font-size="23" font-weight="700" fill="#315f54">局部开启</text>
  <text x="646" y="310" font-family="sans-serif" font-size="23" fill="#1d2924">仍保持关闭</text>
  <text x="65" y="525" font-family="sans-serif" font-size="20" fill="#6f756f">原创示意图 · 不代表所有系统结构 · 据 USFA 与 NIST 资料整理</text>
</svg>
