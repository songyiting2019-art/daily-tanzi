<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">霍尔木兹海峡谈判框架示意图</title>
  <desc id="desc">波斯湾和阿曼湾之间的海峡，进湾路线靠伊朗一侧，出湾路线靠阿曼一侧，收费和批准权仍待谈判。</desc>
  <rect width="760" height="620" rx="34" fill="#f4efe6"/>
  <text x="46" y="62" fill="#173f35" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700">霍尔木兹：谈的是怎样通行</text>
  <text x="46" y="94" fill="#6f776f" font-family="PingFang SC, sans-serif" font-size="17">媒体披露的框架 · 未定案 · 不按比例</text>
  <path d="M0 165 C150 145 236 176 336 155 C460 129 552 155 760 135 L760 0 L0 0Z" fill="#dce8e1"/>
  <path d="M0 500 C150 475 270 520 378 490 C510 452 618 480 760 458 L760 620 L0 620Z" fill="#eee1be"/>
  <path d="M0 165 C184 150 270 194 365 178 C482 159 606 168 760 144 L760 450 C582 468 481 443 365 478 C240 515 138 475 0 500Z" fill="#dce8ee"/>
  <text x="52" y="145" fill="#2e5d50" font-family="PingFang SC, sans-serif" font-size="22" font-weight="700">伊朗</text>
  <text x="52" y="548" fill="#8c672e" font-family="PingFang SC, sans-serif" font-size="22" font-weight="700">阿曼 · 穆桑达姆</text>
  <text x="50" y="330" fill="#55737e" font-family="PingFang SC, sans-serif" font-size="20">波斯湾</text>
  <text x="642" y="330" fill="#55737e" font-family="PingFang SC, sans-serif" font-size="20">阿曼湾</text>
  <path d="M650 224 C525 205 428 220 321 242 C230 260 167 255 92 250" fill="none" stroke="#b05d45" stroke-width="13" stroke-linecap="round"/>
  <path d="M122 250 l34 -22 v44 z" fill="#b05d45"/>
  <text x="280" y="212" fill="#8e4938" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700">进入波斯湾 · 伊朗侧航路</text>
  <path d="M104 404 C220 414 321 394 426 368 C516 346 591 352 672 360" fill="none" stroke="#1f6b63" stroke-width="13" stroke-linecap="round"/>
  <path d="M642 360 l-34 -22 v44 z" fill="#1f6b63"/>
  <text x="238" y="432" fill="#17544e" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700">离开波斯湾 · 阿曼侧航路</text>
  <rect x="150" y="504" width="460" height="82" rx="18" fill="#fffdf9" stroke="#d6c9b4"/>
  <text x="176" y="536" fill="#1d2924" font-family="PingFang SC, sans-serif" font-size="19" font-weight="700">仍在谈：</text>
  <text x="176" y="566" fill="#56635c" font-family="PingFang SC, sans-serif" font-size="18">谁批准 · 是否收费 · 与港口封锁怎样挂钩</text>
</svg>
