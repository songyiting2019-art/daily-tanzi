<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">H5禽流感暴露路径示意</title>
  <desc id="desc">野生鸟类或受污染环境可能把病毒带给海豹，当前单个病例尚不能证明海豹之间持续传播。</desc>
  <rect width="800" height="420" rx="28" fill="#eef5f2"/>
  <text x="48" y="58" fill="#173d36" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="26" font-weight="700">本病例支持的路径与尚待证明的环节</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle">
    <rect x="48" y="112" width="202" height="116" rx="22" fill="#fff" stroke="#558c80" stroke-width="3"/>
    <path d="M102 170c23-39 51-39 74 0-21-11-54-11-74 0Zm32-19v45" fill="none" stroke="#2e7163" stroke-width="7" stroke-linecap="round"/>
    <text x="149" y="211" fill="#173d36" font-size="20" font-weight="650">感染野鸟</text>
    <rect x="299" y="112" width="202" height="116" rx="22" fill="#fff" stroke="#558c80" stroke-width="3"/>
    <path d="M334 177q34-28 68 0t68 0" fill="none" stroke="#2e7163" stroke-width="7" stroke-linecap="round"/>
    <text x="400" y="211" fill="#173d36" font-size="20" font-weight="650">共享海岸环境</text>
    <rect x="550" y="112" width="202" height="116" rx="22" fill="#fff" stroke="#558c80" stroke-width="3"/>
    <path d="M599 170c30-25 80-18 102 4-20 21-67 24-99 8l-18 12 8-24Z" fill="#76a99e"/>
    <circle cx="683" cy="166" r="4" fill="#173d36"/>
    <text x="651" y="211" fill="#173d36" font-size="20" font-weight="650">一只海豹阳性</text>
    <path d="M250 170h39" stroke="#d36d4d" stroke-width="6" stroke-linecap="round"/>
    <path d="m282 158 14 12-14 12" fill="none" stroke="#d36d4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M501 170h39" stroke="#d36d4d" stroke-width="6" stroke-linecap="round"/>
    <path d="m533 158 14 12-14 12" fill="none" stroke="#d36d4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="117" y="286" width="566" height="78" rx="18" fill="#fff7ef" stroke="#d36d4d" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="400" y="319" fill="#7c3b28" font-size="19" font-weight="700">尚未由这个病例证明</text>
    <text x="400" y="347" fill="#7c3b28" font-size="18">海豹之间已经形成持续传播链</text>
  </g>
</svg>
