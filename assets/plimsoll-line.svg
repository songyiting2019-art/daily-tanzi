<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">船舶载重线与干舷</title>
  <desc id="desc">船体侧面标出甲板线、普利姆索尔圆圈、不同季节载重线、水面、吃水和干舷。</desc>
  <rect width="1000" height="560" rx="32" fill="#f5efe3"/>
  <text x="52" y="70" fill="#20352f" font-family="sans-serif" font-size="34" font-weight="700">载重线：把“还能装多少”画在船舷上</text>
  <path d="M0 358c160-24 292 21 460 0s333-19 540 4v198H0z" fill="#a8ced6"/>
  <path d="M80 132h742l92 286c-207 46-550 48-783 0z" fill="#d8dbd4" stroke="#263b35" stroke-width="7"/>
  <path d="M128 173h658" stroke="#263b35" stroke-width="9"/>
  <text x="790" y="181" fill="#20352f" font-family="sans-serif" font-size="21" font-weight="700">甲板线</text>
  <g transform="translate(535 275)" stroke="#263b35" fill="none">
    <circle r="52" stroke-width="8"/>
    <path d="M-76 0H76" stroke-width="8"/>
    <path d="M92-45h88M92-12h104M92 21h83M92 54h101" stroke-width="6"/>
  </g>
  <g fill="#20352f" font-family="sans-serif" font-size="18" font-weight="700">
    <text x="744" y="236">T 热带</text>
    <text x="760" y="269">S 夏季</text>
    <text x="739" y="302">W 冬季</text>
    <text x="755" y="335">F 淡水</text>
  </g>
  <path d="M0 358c160-24 292 21 460 0s333-19 540 4" stroke="#407a87" stroke-width="8" fill="none"/>
  <text x="65" y="350" fill="#245866" font-family="sans-serif" font-size="22" font-weight="700">当前水面</text>
  <path d="M342 177v174" stroke="#b16b46" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="282" y="270" text-anchor="middle" fill="#8d5438" font-family="sans-serif" font-size="23" font-weight="700">干舷</text>
  <path d="M235 358v111" stroke="#315f58" stroke-width="5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="177" y="421" text-anchor="middle" fill="#315f58" font-family="sans-serif" font-size="23" font-weight="700">吃水</text>
  <text x="500" y="520" text-anchor="middle" fill="#526963" font-family="sans-serif" font-size="20">水面不得越过当时适用的线；标记仍需配合稳性、货物固定和水密检查</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 5l10-5v10z" fill="#b16b46"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 5l10-5v10z" fill="#315f58"/></marker>
  </defs>
</svg>
