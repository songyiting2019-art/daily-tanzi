<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">真空保温瓶的隔热结构</title>
  <desc id="desc">剖面示意双层瓶壁、真空层、反射层、窄口与隔热杯盖如何减少热传递。</desc>
  <rect width="1000" height="560" rx="32" fill="#f5efe3"/>
  <text x="54" y="70" fill="#20352f" font-family="sans-serif" font-size="34" font-weight="700">真空保温瓶：把三条传热路都变窄</text>
  <g transform="translate(90 108)">
    <path d="M160 20h170v52c0 16 7 31 20 42l18 15v286c0 28-22 50-50 50H172c-28 0-50-22-50-50V129l18-15c13-11 20-26 20-42z" fill="#dfe7e2" stroke="#263b35" stroke-width="7"/>
    <path d="M181 72h128c0 25 10 48 29 64v266c0 17-14 31-31 31H183c-17 0-31-14-31-31V136c19-16 29-39 29-64z" fill="#b8d5d0" stroke="#8b6a3d" stroke-width="8"/>
    <path d="M201 96h88v38H201z" fill="#f9faf6" stroke="#263b35" stroke-width="5"/>
    <path d="M188 18h114v66H188z" rx="12" fill="#b67a43" stroke="#263b35" stroke-width="6"/>
    <path d="M184 147h122v244c0 13-10 23-23 23h-76c-13 0-23-10-23-23z" fill="#d96d4f" opacity=".9"/>
    <text x="245" y="290" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="26" font-weight="700">饮品</text>
    <path d="M165 110h160" stroke="#fff" stroke-width="12" opacity=".8"/>
    <text x="430" y="76" fill="#20352f" font-family="sans-serif" font-size="24" font-weight="700">杯盖与窄口</text>
    <path d="M405 68H307" stroke="#8b6a3d" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="430" y="174" fill="#20352f" font-family="sans-serif" font-size="24" font-weight="700">真空层</text>
    <text x="430" y="207" fill="#526963" font-family="sans-serif" font-size="20">缺少粒子，传导和对流大幅减慢</text>
    <path d="M405 178H329" stroke="#4f8278" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="430" y="282" fill="#20352f" font-family="sans-serif" font-size="24" font-weight="700">反射表面</text>
    <text x="430" y="315" fill="#526963" font-family="sans-serif" font-size="20">把更多红外辐射反射回去</text>
    <path d="M405 286H309" stroke="#b67a43" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="430" y="388" fill="#20352f" font-family="sans-serif" font-size="24" font-weight="700">仍会漏热</text>
    <text x="430" y="421" fill="#526963" font-family="sans-serif" font-size="20">瓶口、支撑和开盖时都是通道</text>
    <path d="M405 392H351" stroke="#d96d4f" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="context-stroke"/></marker></defs>
</svg>
