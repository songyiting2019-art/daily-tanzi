<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">铅笔H、HB与B等级示意</title>
  <desc id="desc">从4H到4B，笔芯通常由硬而浅变为软而黑。</desc>
  <rect width="960" height="560" rx="36" fill="#f4efe6"/>
  <text x="62" y="70" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2924">同是石墨与黏土，配比改变书写表现</text>
  <text x="86" y="130" font-family="sans-serif" font-size="22" fill="#315f54">较硬 · 较浅</text>
  <text x="750" y="130" font-family="sans-serif" font-size="22" fill="#7b4132">较软 · 较黑</text>
  <line x1="120" y1="172" x2="840" y2="172" stroke="#d8d0c4" stroke-width="12" stroke-linecap="round"/>
  <g font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <text x="140" y="225" fill="#315f54">4H</text>
    <text x="310" y="225" fill="#315f54">2H</text>
    <text x="480" y="225" fill="#1d2924">HB</text>
    <text x="650" y="225" fill="#7b4132">2B</text>
    <text x="820" y="225" fill="#7b4132">4B</text>
  </g>
  <g stroke-linecap="round">
    <line x1="90" y1="282" x2="190" y2="282" stroke="#9ba39d" stroke-width="5"/>
    <line x1="260" y1="282" x2="360" y2="282" stroke="#777f7a" stroke-width="7"/>
    <line x1="430" y1="282" x2="530" y2="282" stroke="#555b57" stroke-width="10"/>
    <line x1="600" y1="282" x2="700" y2="282" stroke="#363a37" stroke-width="14"/>
    <line x1="770" y1="282" x2="870" y2="282" stroke="#1d211e" stroke-width="18"/>
  </g>
  <rect x="84" y="340" width="792" height="112" rx="20" fill="#fff" stroke="#d8d0c4" stroke-width="3"/>
  <text x="120" y="386" font-family="sans-serif" font-size="23" font-weight="700" fill="#315f54">H 端</text>
  <text x="215" y="386" font-family="sans-serif" font-size="22" fill="#1d2924">黏土通常更多，耐磨、细线、较少蹭染</text>
  <text x="120" y="430" font-family="sans-serif" font-size="23" font-weight="700" fill="#7b4132">B 端</text>
  <text x="215" y="430" font-family="sans-serif" font-size="22" fill="#1d2924">石墨通常更多，深色、顺滑、消耗较快</text>
  <text x="62" y="520" font-family="sans-serif" font-size="18" fill="#6f756f">原创示意图 · 等级并非跨厂商绝对等值 · 据 MoMA、Faber-Castell 与史密森尼资料整理</text>
</svg>
