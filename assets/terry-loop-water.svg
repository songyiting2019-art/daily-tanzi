<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">毛巾毛圈吸水结构</title><desc id="d">平整织物与毛圈织物的接触面积和毛细通道对比。</desc>
  <rect width="960" height="560" rx="36" fill="#f4efe6"/>
  <text x="64" y="78" font-family="sans-serif" font-size="34" font-weight="700" fill="#1d2924">毛圈把一块平面变成许多开放通道</text>
  <g transform="translate(80 150)"><rect width="340" height="250" rx="24" fill="#e8ddc9"/><path d="M50 170H290" stroke="#9b7a3f" stroke-width="18"/><circle cx="170" cy="98" r="38" fill="#79aeca"/><text x="170" y="225" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1d2924">平整表面：接触点较少</text></g>
  <g transform="translate(540 150)"><rect width="340" height="250" rx="24" fill="#dce8e1"/><path d="M45 180H295" stroke="#47705b" stroke-width="18"/><path d="M70 180C55 80 125 80 110 180M140 180C125 65 205 65 190 180M220 180C205 90 285 90 270 180" fill="none" stroke="#47705b" stroke-width="14" stroke-linecap="round"/><g fill="#79aeca"><circle cx="92" cy="118" r="16"/><circle cx="162" cy="112" r="20"/><circle cx="238" cy="128" r="15"/></g><path d="M160 78V158" stroke="#31586b" stroke-width="5" stroke-dasharray="9 8"/><text x="170" y="225" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1d2924">毛圈：面积更大，缝隙导水</text></g>
  <text x="64" y="500" font-family="sans-serif" font-size="20" fill="#5e675f">水分进入纤维与纱线间的开放孔隙；圈高、捻度和整理会改变结果。</text>
</svg>
