<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">冰箱磁性门封剖面</title>
  <desc id="desc">冰箱门体靠近金属门框，门封内的磁条产生吸力，柔性褶皱压缩后堵住空气通道。</desc>
  <rect width="960" height="540" rx="32" fill="#edf4f6"/>
  <text x="62" y="72" font-family="sans-serif" font-size="32" font-weight="700" fill="#20363d">吸力让门靠近，软门封负责堵缝</text>
  <rect x="90" y="130" width="250" height="320" rx="18" fill="#d7e2e7" stroke="#607984" stroke-width="4"/>
  <text x="215" y="300" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#29434d">冰箱门体</text>
  <rect x="710" y="130" width="160" height="320" rx="18" fill="#b7c6cc" stroke="#536a73" stroke-width="4"/>
  <text x="790" y="285" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#29434d">金属</text>
  <text x="790" y="319" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#29434d">门框</text>
  <path d="M340 170C430 170 420 230 500 230S570 170 710 170V410C570 410 580 350 500 350S430 410 340 410Z" fill="#f5d8a8" stroke="#9d7139" stroke-width="4"/>
  <rect x="585" y="245" width="82" height="90" rx="12" fill="#497684"/>
  <text x="626" y="297" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">磁条</text>
  <path d="M675 275H724" stroke="#c15f43" stroke-width="7" stroke-linecap="round"/>
  <path d="M707 259L729 275L707 291" fill="none" stroke="#c15f43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="112" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#7b4d2d">柔性褶皱随门框变形</text>
  <path d="M525 123L510 197" stroke="#7b4d2d" stroke-width="3"/>
  <text x="480" y="500" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#36515b">门封硬化、破裂或有污物时，磁力还在，暖湿空气仍可能漏入</text>
</svg>
