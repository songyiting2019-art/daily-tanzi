<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">主动降噪的反相叠加示意</title>
  <desc id="desc">环境声与相反相位的控制声在耳边叠加，使合成波振幅减小。</desc>
  <rect width="960" height="560" rx="36" fill="#f4efe6"/>
  <text x="62" y="68" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2924">不是制造真空，而是在耳边做一次实时相加</text>
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M80 160 C120 95 160 95 200 160 S280 225 320 160 S400 95 440 160" stroke="#c56e4f"/>
    <path d="M520 160 C560 225 600 225 640 160 S720 95 760 160 S840 225 880 160" stroke="#315f54"/>
  </g>
  <text x="260" y="105" font-family="sans-serif" font-size="23" font-weight="700" fill="#c56e4f">环境噪声</text>
  <text x="635" y="105" font-family="sans-serif" font-size="23" font-weight="700" fill="#315f54">控制声：尽量反相</text>
  <text x="480" y="175" font-family="sans-serif" font-size="32" text-anchor="middle" fill="#7b6847">＋</text>
  <path d="M480 235 V292" stroke="#7b6847" stroke-width="8" stroke-linecap="round"/>
  <path d="M458 272 L480 297 502 272" fill="none" stroke="#7b6847" stroke-width="8" stroke-linejoin="round"/>
  <line x1="118" y1="365" x2="842" y2="365" stroke="#d8d0c4" stroke-width="3"/>
  <path d="M118 365 C158 345 198 345 238 365 S318 385 358 365 S438 345 478 365 S558 385 598 365 S678 345 718 365 S798 385 842 365" fill="none" stroke="#546b62" stroke-width="9" stroke-linecap="round"/>
  <text x="480" y="330" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1d2924">目标位置的合成振幅变小</text>
  <rect x="117" y="420" width="726" height="62" rx="18" fill="#fff" stroke="#d8d0c4" stroke-width="3"/>
  <text x="480" y="460" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#1d2924">低频、持续声较容易跟踪；高频与突发声更依赖耳罩密封</text>
  <text x="62" y="525" font-family="sans-serif" font-size="18" fill="#6f756f">原创示意图 · 非实测波形 · 据美国声学学会资料整理</text>
</svg>
