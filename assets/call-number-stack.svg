<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">索书号组成</title><desc id="d">索书号依次表示学科、细分主题、作者顺序和出版年份。</desc>
  <rect width="960" height="560" rx="36" fill="#f4efe6"/>
  <text x="64" y="76" font-family="sans-serif" font-size="34" font-weight="700" fill="#1d2924">把书架地址一层层缩小</text>
  <g transform="translate(90 120)" font-family="sans-serif"><rect width="260" height="360" rx="24" fill="#1d2924"/><rect x="35" y="40" width="190" height="280" rx="14" fill="#fffdf8"/><text x="130" y="115" text-anchor="middle" font-size="48" font-weight="700" fill="#1d2924">BF</text><text x="130" y="175" text-anchor="middle" font-size="42" fill="#1d2924">77</text><text x="130" y="235" text-anchor="middle" font-size="42" fill="#1d2924">.L28</text><text x="130" y="291" text-anchor="middle" font-size="36" fill="#1d2924">2009</text></g>
  <g transform="translate(430 128)" font-family="sans-serif"><path d="M0 20H420M0 105H420M0 190H420M0 275H420" stroke="#c7bda9" stroke-width="3"/><text y="8" font-size="22" font-weight="700" fill="#31586b">BF</text><text x="90" y="8" font-size="22" fill="#1d2924">学科大类</text><text y="93" font-size="22" font-weight="700" fill="#31586b">77</text><text x="90" y="93" font-size="22" fill="#1d2924">细分主题</text><text y="178" font-size="22" font-weight="700" fill="#31586b">.L28</text><text x="90" y="178" font-size="22" fill="#1d2924">作者或书名顺序（按小数读）</text><text y="263" font-size="22" font-weight="700" fill="#31586b">2009</text><text x="90" y="263" font-size="22" fill="#1d2924">版本年份</text><text y="345" font-size="20" fill="#5e675f">完整组合才是馆藏项目的书架地址。</text></g>
</svg>
