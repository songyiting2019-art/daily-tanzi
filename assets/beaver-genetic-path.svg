<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">诺福克河狸家庭与遗传管理路径</title>
  <desc id="desc">一对来源不明的成年河狸生出两只幼崽，形成四口之家，但只有一个亲缘来源；依法补充个体需要许可、健康和遗传评估。</desc>
  <rect width="960" height="540" rx="32" fill="#f4f0e6"/>
  <text x="64" y="76" font-family="sans-serif" font-size="32" font-weight="700" fill="#27352d">繁殖成功，不等于种群已经稳定</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="70" y="125" width="250" height="122" rx="24" fill="#d8e7dc" stroke="#54745d" stroke-width="3"/>
    <text x="195" y="171" font-size="25" font-weight="700" fill="#294333">1 对成年河狸</text>
    <text x="195" y="207" font-size="20" fill="#3e5648">2025 年冬天出现</text>
    <text x="195" y="234" font-size="20" fill="#3e5648">来源尚未确认</text>
    <path d="M320 186H410" stroke="#54745d" stroke-width="7" stroke-linecap="round"/>
    <path d="M394 169L416 186L394 203" fill="none" stroke="#54745d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="420" y="125" width="250" height="122" rx="24" fill="#f1d9b7" stroke="#a66f31" stroke-width="3"/>
    <text x="545" y="171" font-size="25" font-weight="700" fill="#5a3c1d">2 只幼崽</text>
    <text x="545" y="207" font-size="20" fill="#684d31">约三个月大</text>
    <text x="545" y="234" font-size="20" fill="#684d31">同胞、同一亲缘来源</text>
    <path d="M670 186H755" stroke="#a66f31" stroke-width="7" stroke-linecap="round"/>
    <path d="M739 169L761 186L739 203" fill="none" stroke="#a66f31" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="770" y="125" width="130" height="122" rx="24" fill="#f2c9c3" stroke="#a65348" stroke-width="3"/>
    <text x="835" y="170" font-size="23" font-weight="700" fill="#6b2e28">近交</text>
    <text x="835" y="205" font-size="23" font-weight="700" fill="#6b2e28">风险</text>
    <text x="835" y="234" font-size="17" fill="#74433d">缺少新基因</text>
    <rect x="125" y="338" width="710" height="118" rx="28" fill="#fff" stroke="#738c79" stroke-width="3"/>
    <text x="480" y="381" font-size="25" font-weight="700" fill="#294333">长期路径：依法补充经过评估的个体</text>
    <text x="480" y="422" font-size="21" fill="#3e5648">许可申请　→　健康筛查　→　遗传匹配　→　持续监测</text>
  </g>
  <path d="M835 247V290C835 316 811 319 770 319H516C493 319 480 329 480 338" fill="none" stroke="#738c79" stroke-width="6" stroke-dasharray="12 10"/>
</svg>
