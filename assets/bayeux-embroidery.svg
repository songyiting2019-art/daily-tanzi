<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">挂毯织造与贝叶刺绣的结构区别</title>
  <desc id="desc">左侧图案由经纬线织成，右侧贝叶作品是在织好的亚麻底布上加羊毛绣线。</desc>
  <rect width="800" height="420" rx="28" fill="#f4efe4"/>
  <text x="48" y="58" fill="#3d3329" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="26" font-weight="700">“织成图案”与“在布上绣图案”</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="48" y="92" width="328" height="266" rx="22" fill="#fffaf1" stroke="#9f8465" stroke-width="3"/>
    <text x="212" y="126" text-anchor="middle" fill="#3d3329" font-size="22" font-weight="700">挂毯织造</text>
    <g stroke-width="6">
      <path d="M92 158v138M132 158v138M172 158v138M212 158v138M252 158v138M292 158v138M332 158v138" stroke="#d5b98f"/>
      <path d="M84 174h256M84 214h256M84 254h256M84 294h256" stroke="#b04f3c"/>
    </g>
    <text x="212" y="332" text-anchor="middle" fill="#6b5845" font-size="17">图案属于经纬结构</text>
    <rect x="424" y="92" width="328" height="266" rx="22" fill="#fffaf1" stroke="#9f8465" stroke-width="3"/>
    <text x="588" y="126" text-anchor="middle" fill="#3d3329" font-size="22" font-weight="700">贝叶刺绣</text>
    <g stroke="#d5b98f" stroke-width="2" opacity=".8">
      <path d="M462 158v138M486 158v138M510 158v138M534 158v138M558 158v138M582 158v138M606 158v138M630 158v138M654 158v138M678 158v138M702 158v138"/>
      <path d="M452 170h272M452 194h272M452 218h272M452 242h272M452 266h272M452 290h272"/>
    </g>
    <path d="M474 264C517 169 572 293 617 190C641 139 682 169 705 229" fill="none" stroke="#b04f3c" stroke-width="12" stroke-linecap="round"/>
    <text x="588" y="332" text-anchor="middle" fill="#6b5845" font-size="17">羊毛线加在亚麻底布上</text>
    <path d="M390 180v90" stroke="#6b5845" stroke-width="3"/>
    <path d="m378 258 12 14 12-14" fill="none" stroke="#6b5845" stroke-width="3"/>
  </g>
</svg>
