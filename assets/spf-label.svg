<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">防晒标签的四项信息</title>
  <desc id="desc">SPF数值、广谱、耐水时长和补涂提示分别回答不同问题，SPF不是可晒时长。</desc>
  <rect width="720" height="640" rx="28" fill="#f8f1df"/>
  <text x="42" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#2a2d27">一瓶防晒，标签在回答四个问题</text>
  <text x="42" y="92" font-family="sans-serif" font-size="19" fill="#676257">SPF不是倒计时；涂抹量、出汗和摩擦都会改变效果</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="42" y="126" width="300" height="190" rx="20" fill="#fffdf8" stroke="#c7bda7" stroke-width="2"/>
    <text x="192" y="168" font-size="21" fill="#665f54">晒伤防护</text>
    <text x="192" y="226" font-size="42" font-weight="700" fill="#b05245">SPF 30</text>
    <text x="192" y="270" font-size="22" fill="#3d493f">规定条件下的晒红剂量比</text>
    <rect x="378" y="126" width="300" height="190" rx="20" fill="#e3ece7"/>
    <text x="528" y="168" font-size="21" fill="#52635b">覆盖波段</text>
    <text x="528" y="226" font-size="38" font-weight="700" fill="#315f53">广谱</text>
    <text x="528" y="270" font-size="22" fill="#3d493f">同时通过UVA防护测试</text>
    <rect x="42" y="340" width="300" height="190" rx="20" fill="#e7edf3"/>
    <text x="192" y="382" font-size="21" fill="#52606d">下水以后</text>
    <text x="192" y="440" font-size="38" font-weight="700" fill="#48657a">40 / 80 分钟</text>
    <text x="192" y="484" font-size="22" fill="#3d493f">耐水，不等于“防水”</text>
    <rect x="378" y="340" width="300" height="190" rx="20" fill="#f2e2d8"/>
    <text x="528" y="382" font-size="21" fill="#6a5548">现实使用</text>
    <text x="528" y="440" font-size="38" font-weight="700" fill="#9a5e3e">每2小时</text>
    <text x="528" y="484" font-size="22" fill="#3d493f">通常补涂；游泳出汗更早</text>
  </g>
  <rect x="42" y="554" width="636" height="54" rx="12" fill="#fffdf8" stroke="#d6cbbc"/>
  <text x="360" y="588" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#3d493f">帽子、衣物、阴影和避开强日照同样重要。</text>
</svg>
