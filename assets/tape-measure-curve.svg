<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">卷尺横截面与伸出、收卷状态示意</title>
  <desc id="desc">卷尺伸出时横截面呈弧形以增加抗弯能力，卷入尺壳时被压平并绕在线盘上。</desc>
  <rect width="960" height="540" rx="34" fill="#f4efe6"/>
  <text x="70" y="72" font-family="sans-serif" font-size="28" font-weight="700" fill="#1d2924">同一片薄钢带，两种状态</text>
  <text x="70" y="111" font-family="sans-serif" font-size="18" fill="#6d604d">关键不是把钢片做厚，而是让横截面形成弧度</text>
  <g transform="translate(75 165)">
    <rect x="0" y="0" width="370" height="265" rx="24" fill="#dce8e1"/>
    <text x="28" y="43" font-family="sans-serif" font-size="22" font-weight="700" fill="#1d2924">伸出：弧形截面</text>
    <path d="M55 152 Q185 60 315 152" fill="none" stroke="#b98a49" stroke-width="24" stroke-linecap="round"/>
    <path d="M55 184 H315" stroke="#7b6847" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M185 78 V184" stroke="#7b6847" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="83" y="230" font-family="sans-serif" font-size="18" fill="#1d2924">材料离中性面更远，较难下垂</text>
  </g>
  <g transform="translate(515 165)">
    <rect x="0" y="0" width="370" height="265" rx="24" fill="#dce8ee"/>
    <text x="28" y="43" font-family="sans-serif" font-size="22" font-weight="700" fill="#1d2924">收卷：局部压平</text>
    <circle cx="185" cy="151" r="73" fill="none" stroke="#b98a49" stroke-width="22"/>
    <circle cx="185" cy="151" r="39" fill="#f4efe6" stroke="#7b6847" stroke-width="3"/>
    <path d="M258 151 C310 151 317 185 335 207" fill="none" stroke="#b98a49" stroke-width="22" stroke-linecap="round"/>
    <text x="77" y="230" font-family="sans-serif" font-size="18" fill="#1d2924">弧度被压平，钢带才能绕在线盘上</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7b6847"/></marker></defs>
  <text x="70" y="492" font-family="sans-serif" font-size="16" fill="#7b6847">原创示意 · 未按比例</text>
</svg>
