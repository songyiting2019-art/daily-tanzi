<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">电磁炉加热路径示意</title>
  <desc id="desc">线圈产生交变磁场，在锅底感生涡流，锅底先发热并向食物和玻璃面板传热。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ef7d57"/></marker></defs>
  <rect width="960" height="520" rx="28" fill="#f7f2e9"/>
  <path d="M240 90h480l-42 180H282z" fill="#59616d"/>
  <path d="M292 112h376l-25 110H317z" fill="#dfe9d8"/>
  <text x="480" y="170" text-anchor="middle" font-size="28" fill="#263238">锅与食物</text>
  <path d="M310 270h340" stroke="#d24d3f" stroke-width="18" stroke-linecap="round"/>
  <path d="M360 250c40-50 200-50 240 0" fill="none" stroke="#ef7d57" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="480" y="238" text-anchor="middle" font-size="23" fill="#a4382e">锅底涡流先发热</text>
  <rect x="180" y="300" width="600" height="34" rx="10" fill="#9fc5d1"/>
  <text x="800" y="326" font-size="22" fill="#35535d">玻璃面板</text>
  <path d="M325 405c40-70 270-70 310 0" fill="none" stroke="#315f82" stroke-width="16"/>
  <path d="M360 405c40-38 200-38 240 0" fill="none" stroke="#74a6c9" stroke-width="12"/>
  <text x="480" y="460" text-anchor="middle" font-size="25" fill="#244b68">交流线圈</text>
  <path d="M350 390C260 300 280 220 350 180M610 390c90-90 70-170 0-210" fill="none" stroke="#6885b5" stroke-width="5" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="82" y="225" font-size="23" fill="#536a98">交变磁场</text>
  <text x="480" y="500" text-anchor="middle" font-size="18" fill="#736b61">原创示意，不按比例</text>
</svg>
