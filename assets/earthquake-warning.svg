<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
  <title id="title">地震预警与地震波赛跑示意图</title>
  <desc id="desc">地震发生后P波先到传感器，通信信号快速抵达远处城市，随后较慢的S波到达；震中附近可能没有预警时间。</desc>
  <rect width="760" height="680" rx="34" fill="#f4efe6"/>
  <text x="46" y="62" fill="#173f35" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700">预警是在地震之后抢几秒</text>
  <text x="46" y="94" fill="#6f776f" font-family="PingFang SC, sans-serif" font-size="17">通信信号和地震波的速度差，形成短暂窗口</text>
  <rect x="0" y="468" width="760" height="212" fill="#e9e0d2"/>
  <path d="M0 468 H760" stroke="#8e7658" stroke-width="5"/>
  <path d="M84 612 l45 -94 32 54 45 -80 42 120" fill="none" stroke="#b05d45" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="165" cy="548" r="18" fill="#b05d45"/>
  <text x="82" y="648" fill="#8e4938" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700">断层已经破裂</text>
  <g>
    <rect x="278" y="408" width="22" height="60" rx="6" fill="#173f35"/>
    <path d="M289 408 v-54" stroke="#173f35" stroke-width="6"/>
    <circle cx="289" cy="350" r="11" fill="#d6a24d"/>
    <text x="236" y="502" fill="#275b4d" font-family="PingFang SC, sans-serif" font-size="17">传感器</text>
  </g>
  <path d="M190 530 C225 492 247 475 285 454" fill="none" stroke="#1f6b63" stroke-width="8" stroke-dasharray="12 9"/>
  <text x="202" y="480" fill="#17544e" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700">P波先到</text>
  <path d="M188 565 C340 530 445 538 686 566" fill="none" stroke="#b05d45" stroke-width="17" stroke-linecap="round" opacity="0.82"/>
  <path d="M652 566 l-34 -25 v50 z" fill="#b05d45"/>
  <text x="416" y="620" fill="#8e4938" font-family="PingFang SC, sans-serif" font-size="19" font-weight="700">较慢、通常更强的S波随后到城市</text>
  <path d="M300 336 C414 204 531 188 665 270" fill="none" stroke="#2e6e87" stroke-width="8" stroke-linecap="round"/>
  <path d="M642 255 l-38 -3 18 33 z" fill="#2e6e87"/>
  <text x="394" y="196" fill="#2e6e87" font-family="PingFang SC, sans-serif" font-size="19" font-weight="700">电信消息更快到达</text>
  <g fill="#173f35">
    <rect x="592" y="367" width="48" height="101"/><rect x="648" y="330" width="50" height="138"/>
    <rect x="704" y="390" width="32" height="78"/>
  </g>
  <g fill="#eee1be">
    <rect x="603" y="385" width="9" height="12"/><rect x="619" y="385" width="9" height="12"/>
    <rect x="659" y="350" width="10" height="13"/><rect x="678" y="350" width="10" height="13"/>
    <rect x="659" y="377" width="10" height="13"/><rect x="678" y="377" width="10" height="13"/>
  </g>
  <rect x="535" y="118" width="178" height="88" rx="18" fill="#dce8ee" stroke="#b8ccd5"/>
  <text x="624" y="153" fill="#2e6e87" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle">手机先响</text>
  <text x="624" y="181" fill="#55737e" font-family="PingFang SC, sans-serif" font-size="17" text-anchor="middle">趴下 · 掩护 · 抓牢</text>
  <path d="M150 520 C118 462 108 408 132 354" fill="none" stroke="#9a7132" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="56" y="325" fill="#9a7132" font-family="PingFang SC, sans-serif" font-size="17">震中附近：</text>
  <text x="56" y="350" fill="#9a7132" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700">可能来不及预警</text>
</svg>
