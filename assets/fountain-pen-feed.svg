<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">钢笔笔舌的墨水与空气流动</title>
  <desc id="desc">墨水沿细槽向笔尖流动，空气经独立通道回到储墨空间，鳍片暂存多余墨水。</desc>
  <rect width="1200" height="720" rx="42" fill="#f4efe6"/>
  <text x="80" y="92" font-family="sans-serif" font-size="40" font-weight="700" fill="#1d2924">一股墨水向前，一股空气向后</text>
  <rect x="85" y="170" width="330" height="350" rx="80" fill="#dce8e1" stroke="#1d2924" stroke-width="8"/>
  <path d="M415 255 H930 L1080 345 L930 435 H415" fill="#d6c5a1" stroke="#1d2924" stroke-width="8"/>
  <path d="M380 332 H980" stroke="#8c3f2f" stroke-width="26" stroke-linecap="round"/>
  <path d="M780 384 H450" stroke="#3b7080" stroke-width="20" stroke-linecap="round" stroke-dasharray="30 22"/>
  <path d="M930 295 L1080 345 L930 395" fill="none" stroke="#1d2924" stroke-width="10"/>
  <g stroke="#6b5739" stroke-width="12">
    <path d="M500 440 v105"/><path d="M570 440 v130"/><path d="M640 440 v105"/><path d="M710 440 v130"/><path d="M780 440 v105"/>
  </g>
  <polygon points="980,332 930,305 930,359" fill="#8c3f2f"/>
  <polygon points="450,384 500,357 500,411" fill="#3b7080"/>
  <text x="120" y="610" font-family="sans-serif" font-size="30" fill="#1d2924">储墨空间</text>
  <text x="790" y="285" font-family="sans-serif" font-size="30" fill="#8c3f2f">墨水到笔尖</text>
  <text x="475" y="365" font-family="sans-serif" font-size="30" fill="#3b7080">空气返回</text>
  <text x="535" y="635" font-family="sans-serif" font-size="28" fill="#6b5739">鳍片缓冲多余墨水</text>
</svg>
