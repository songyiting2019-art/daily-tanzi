  <text x="54" y="154" fill="#8e4938" font-family="PingFang SC, sans-serif" font-size="21" font-weight="700">微波 · 约12厘米</text>
  <text x="54" y="184" fill="#8e4938" font-family="PingFang SC, sans-serif" font-size="16">在导电网格上反射、衰减</text>
