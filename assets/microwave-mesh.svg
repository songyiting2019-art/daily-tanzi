<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">微波炉门网透光挡微波示意图</title>
  <desc id="desc">短波长可见光穿过毫米级网孔，约十二厘米波长的微波在导电网格上被强烈反射和衰减。</desc>
  <rect width="760" height="640" rx="34" fill="#f4efe6"/>
  <text x="46" y="64" fill="#173f35" font-family="PingFang SC, sans-serif" font-size="29" font-weight="700">同一张网，两种波看到两扇门</text>
  <text x="46" y="99" fill="#6f776f" font-family="PingFang SC, sans-serif" font-size="17">示意图不按比例</text>
