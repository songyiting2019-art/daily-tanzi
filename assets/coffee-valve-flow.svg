<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">咖啡袋单向阀气流</title><desc id="desc">袋内二氧化碳在压差足够时向外排出，外界氧气被闭合阀片阻挡。</desc>
  <rect width="760" height="420" rx="28" fill="#f4eee3"/>
  <path d="M170 70 H515 L560 355 H125 Z" fill="#9f7146" stroke="#5b3a22" stroke-width="5"/>
  <path d="M170 70 H515" stroke="#ecd7b8" stroke-width="16"/>
  <ellipse cx="245" cy="290" rx="45" ry="26" fill="#3d2416"/><ellipse cx="350" cy="315" rx="45" ry="26" fill="#3d2416"/><ellipse cx="455" cy="280" rx="45" ry="26" fill="#3d2416"/>
  <text x="340" y="386" text-anchor="middle" font-size="21" font-family="sans-serif" fill="#49301f">烘焙咖啡持续释放 CO₂</text>
  <circle cx="470" cy="155" r="58" fill="#e8ddc9" stroke="#5b3a22" stroke-width="6"/>
  <path d="M430 160 H510" stroke="#333" stroke-width="9"/><path d="M440 145 Q470 122 500 145" fill="none" stroke="#c64b3b" stroke-width="10"/>
  <path d="M420 235 C420 205 442 190 455 176" fill="none" stroke="#f4d35e" stroke-width="10" stroke-linecap="round"/><path d="M458 173 l-4 27 24 -14 z" fill="#f4d35e"/>
  <text x="317" y="190" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700" fill="#fff6df">袋内正压</text>
  <path d="M520 142 C585 105 630 90 690 90" fill="none" stroke="#c64b3b" stroke-width="10" stroke-linecap="round"/><path d="M692 90 l-25 -16 2 30 z" fill="#c64b3b"/>
  <text x="626" y="62" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#9c342b">CO₂ 向外</text>
  <path d="M690 215 H555" stroke="#4d85a6" stroke-width="10" stroke-linecap="round"/><path d="M548 215 l27 -17 v34 z" fill="#4d85a6"/>
  <path d="M528 190 l38 50 M566 190 l-38 50" stroke="#9c342b" stroke-width="9"/>
  <text x="625" y="260" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#315d78">O₂ 受阻</text>
  <text x="618" y="335" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#5f5144">压差回落后阀片重新贴合</text>
