<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">水果PLU代码用途示意图</title>
  <desc id="desc">常规香蕉示例代码四零一一，有机香蕉在对应四位代码前加九成为九四零一一；八前缀不是转基因标记。</desc>
  <rect width="760" height="620" rx="34" fill="#f4efe6"/>
  <text x="46" y="64" fill="#173f35" font-family="PingFang SC, sans-serif" font-size="29" font-weight="700">小贴纸先服务结账，不是食品身份证</text>
  <text x="46" y="99" fill="#6f776f" font-family="PingFang SC, sans-serif" font-size="17">PLU体系为自愿采用；示例用于说明代码关系</text>
  <rect x="46" y="142" width="302" height="176" rx="26" fill="#fffaf2" stroke="#d8d0c4"/>
  <text x="76" y="188" fill="#7b6847" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700">常规种植香蕉</text>
  <ellipse cx="196" cy="246" rx="86" ry="43" fill="#f1cb4f" transform="rotate(-13 196 246)"/>
  <rect x="230" y="210" width="86" height="54" rx="27" fill="#ffffff" stroke="#c8c1b7"/>
  <text x="273" y="245" text-anchor="middle" fill="#173f35" font-family="ui-monospace, monospace" font-size="24" font-weight="700">4011</text>
  <rect x="412" y="142" width="302" height="176" rx="26" fill="#e6efe8" stroke="#b8ccb9"/>
  <text x="442" y="188" fill="#275b4d" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700">有机香蕉</text>
  <ellipse cx="562" cy="246" rx="86" ry="43" fill="#f1cb4f" transform="rotate(-13 562 246)"/>
  <rect x="596" y="210" width="96" height="54" rx="27" fill="#ffffff" stroke="#aabfae"/>
  <text x="644" y="245" text-anchor="middle" fill="#173f35" font-family="ui-monospace, monospace" font-size="23" font-weight="700">94011</text>
  <path d="M356 230 H402" stroke="#1f6b63" stroke-width="5"/><path d="M402 230 l-16 -10 v20 z" fill="#1f6b63"/>
  <text x="379" y="207" text-anchor="middle" fill="#1f6b63" font-family="PingFang SC, sans-serif" font-size="16" font-weight="700">前加9</text>
  <rect x="46" y="354" width="668" height="98" rx="22" fill="#dce8ee"/>
  <text x="76" y="394" fill="#2e6e87" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700">扫码或手输 → 调出商品、规格、种植方式与价格 → 更新库存</text>
  <text x="76" y="426" fill="#55737e" font-family="PingFang SC, sans-serif" font-size="16">数字按号段分配，不能把每一位拆成固定含义</text>
  <rect x="46" y="486" width="668" height="88" rx="22" fill="#f1d8d1"/>
  <text x="76" y="526" fill="#8e4938" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700">“8开头 = 转基因”是错误口诀</text>
  <text x="76" y="553" fill="#895f57" font-family="PingFang SC, sans-serif" font-size="16">8前缀从未在零售端实际采用；83000、84000现用于代码扩容</text>
</svg>
