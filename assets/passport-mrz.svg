<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">护照机读区字段示意图</title>
  <desc id="desc">两行固定长度字符，展示填充符号、护照号码、出生日期和校验位。所有人物和号码均为虚构。</desc>
  <rect width="960" height="520" rx="28" fill="#edf2ee"/>
  <text x="58" y="66" font-family="sans-serif" font-size="32" font-weight="700" fill="#1d2924">护照底部两行字符在做什么</text>
  <text x="58" y="103" font-family="sans-serif" font-size="18" fill="#5b665f">示意图 · 姓名和号码均为虚构</text>
  <rect x="58" y="142" width="844" height="174" rx="18" fill="#fffdf8" stroke="#b8b0a2" stroke-width="2"/>
  <text x="82" y="205" font-family="monospace" font-size="29" font-weight="700" fill="#17231f">P&lt;CHNLI&lt;&lt;MING&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
  <text x="82" y="266" font-family="monospace" font-size="29" font-weight="700" fill="#17231f">E1234567&lt;6CHN9001011F3601018&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;04</text>
  <g font-family="sans-serif" font-size="17" fill="#4a554f">
    <line x1="152" y1="282" x2="152" y2="358" stroke="#b05245" stroke-width="3"/>
    <text x="76" y="386">护照号</text>
    <line x1="278" y1="282" x2="278" y2="358" stroke="#b98a49" stroke-width="3"/>
    <text x="234" y="386">校验位</text>
    <line x1="431" y1="282" x2="431" y2="358" stroke="#315f53" stroke-width="3"/>
    <text x="372" y="386">出生日期</text>
    <line x1="667" y1="218" x2="667" y2="358" stroke="#6b5b8b" stroke-width="3"/>
    <text x="575" y="386">&lt; 用来分隔或填空</text>
  </g>
  <rect x="58" y="422" width="844" height="55" rx="12" fill="#dce8e1"/>
  <text x="80" y="457" font-family="sans-serif" font-size="18" fill="#29483f">校验位能发现不少读错或抄错，但它不是防伪签名，也不证明身份真实。</text>
</svg>
