<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">刺子绣平针补强示意</title>
  <desc id="desc">白色平针穿过叠放的靛蓝布层，构成相连的几何网格并分散拉力。</desc>
  <rect width="1200" height="720" rx="42" fill="#f4efe6"/>
  <text x="80" y="92" font-family="sans-serif" font-size="40" font-weight="700" fill="#1d2924">连续平针把布层连成受力网</text>
  <rect x="105" y="150" width="990" height="450" rx="28" fill="#234f65"/>
  <g fill="none" stroke="#f5efe3" stroke-width="14" stroke-linecap="round" stroke-dasharray="30 24">
    <path d="M160 250 H1040"/><path d="M160 375 H1040"/><path d="M160 500 H1040"/>
    <path d="M285 190 V560"/><path d="M475 190 V560"/><path d="M665 190 V560"/><path d="M855 190 V560"/>
    <path d="M160 250 L410 500 L660 250 L910 500 L1040 370"/>
    <path d="M160 500 L410 250 L660 500 L910 250 L1040 380"/>
  </g>
  <path d="M105 580 H1095" stroke="#163746" stroke-width="28" opacity=".65"/>
  <text x="135" y="660" font-family="sans-serif" font-size="30" fill="#1d2924">针脚既形成纹样，也把局部拉力分散到更大面积</text>
</svg>
