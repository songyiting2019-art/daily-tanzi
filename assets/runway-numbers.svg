<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">跑道09与27编号示意</title>
  <desc id="desc">同一条东西向跑道的两个进近方向约为090度和270度，因此编号为09和27。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d95f45"/></marker></defs>
  <rect width="960" height="520" rx="28" fill="#e8efe5"/>
  <rect x="115" y="155" width="730" height="210" rx="8" fill="#3c4248"/>
  <path d="M160 260h640" stroke="#f5f0db" stroke-width="7" stroke-dasharray="42 30"/>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="82" font-weight="700" text-anchor="middle">
    <text x="205" y="290" transform="rotate(90 205 260)">09</text>
    <text x="755" y="290" transform="rotate(-90 755 260)">27</text>
  </g>
  <path d="M120 110h300" stroke="#d95f45" stroke-width="7" marker-end="url(#a)"/>
  <text x="120" y="82" font-size="25" fill="#743629">向约090°进近，看见09</text>
  <path d="M840 410H540" stroke="#d95f45" stroke-width="7" marker-end="url(#a)"/>
  <text x="840" y="456" text-anchor="end" font-size="25" fill="#743629">向约270°进近，看见27</text>
  <g font-family="Arial, sans-serif" text-anchor="middle"><text x="480" y="54" font-size="25" fill="#294f3e">N</text><path d="M480 68v58" stroke="#294f3e" stroke-width="5"/><path d="M480 68l-12 22h24z" fill="#294f3e"/></g>
  <text x="480" y="500" text-anchor="middle" font-size="18" fill="#667267">原创示意，不作导航使用</text>
</svg>
