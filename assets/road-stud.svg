<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">道路反光钉的逆反射</title>
  <desc id="desc">汽车车灯发出的光照向道路反光钉，再沿接近原路的方向返回驾驶员眼睛。</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081225"/><stop offset="1" stop-color="#263548"/></linearGradient><linearGradient id="road" x1="0" x2="1"><stop stop-color="#374151"/><stop offset="1" stop-color="#111827"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="y" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#fde047"/></marker><marker id="c" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker></defs>
  <rect width="1200" height="720" rx="34" fill="url(#sky)"/>
  <path d="M0 450L1200 305V720H0Z" fill="url(#road)"/>
  <path d="M135 435L385 408L430 510L92 540Z" fill="#2563eb" stroke="#93c5fd" stroke-width="7"/>
  <rect x="194" y="357" width="133" height="89" rx="24" fill="#bfdbfe" opacity=".85"/>
  <circle cx="235" cy="385" r="12" fill="#fff" filter="url(#g)"/><circle cx="141" cy="489" r="26" fill="#0f172a"/><circle cx="372" cy="471" r="26" fill="#0f172a"/>
  <path d="M230 399L792 506" fill="none" stroke="#fde047" stroke-width="9" opacity=".9" marker-end="url(#y)"/>
  <path d="M798 488L250 380" fill="none" stroke="#67e8f9" stroke-width="9" opacity=".95" marker-end="url(#c)"/>
  <path d="M740 526L800 474L873 504L842 561L771 569Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="7"/>
  <g fill="#67e8f9"><path d="M770 522l24-17 24 17-24 17z"/><path d="M806 542l21-15 21 15-21 15z"/></g>
  <text x="615" y="332" fill="#fde047" font-size="30" font-family="sans-serif">入射车灯</text>
  <text x="545" y="235" fill="#67e8f9" font-size="30" font-family="sans-serif">沿接近原路返回</text>
  <text x="830" y="610" fill="#e2e8f0" font-size="28" font-family="sans-serif">凸起反光钉</text>
  <text x="600" y="86" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="700" font-family="sans-serif">逆反射不是自己发光</text>
</svg>
