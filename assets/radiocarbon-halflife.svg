<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">碳十四半衰期与测年上限示意</title>
  <desc id="desc">碳十四每约5730年剩余比例减半，约5万年后信号接近可靠测量边界。</desc>
  <rect width="1200" height="680" rx="42" fill="#e7e3db"/>
  <text x="72" y="86" fill="#173f35" font-family="PingFang SC, sans-serif" font-size="40" font-weight="700">碳十四会不断减半，不会无限可测</text>
  <text x="72" y="128" fill="#66736c" font-family="PingFang SC, sans-serif" font-size="24">示意比例；真实结果还要校准并排除污染</text>
  <g transform="translate(95 180)" font-family="PingFang SC, sans-serif">
    <line x1="0" y1="350" x2="1010" y2="350" stroke="#173f35" stroke-width="5"/>
    <line x1="0" y1="0" x2="0" y2="350" stroke="#173f35" stroke-width="5"/>
    <g fill="#66736c" font-size="20"><text x="-18" y="12" text-anchor="end">100%</text><text x="-18" y="185" text-anchor="end">50%</text><text x="-18" y="358" text-anchor="end">0%</text></g>
    <path d="M0 8 C115 76 185 132 253 180 C370 250 515 301 690 329 C815 345 910 349 1010 350" fill="none" stroke="#b98639" stroke-width="14" stroke-linecap="round"/>
    <g fill="#173f35">
      <circle cx="0" cy="8" r="14"/><circle cx="253" cy="180" r="14"/><circle cx="506" cy="266" r="14"/><circle cx="759" cy="309" r="14"/><circle cx="1010" cy="345" r="14"/>
    </g>
    <g fill="#173f35" font-size="22" font-weight="700">
      <text x="0" y="405" text-anchor="middle">死亡</text><text x="253" y="405" text-anchor="middle">5730年</text><text x="506" y="405" text-anchor="middle">1.15万年</text><text x="759" y="405" text-anchor="middle">1.72万年</text><text x="1010" y="405" text-anchor="middle">约5万年</text>
    </g>
    <g fill="#66736c" font-size="20"><text x="253" y="150" text-anchor="middle">剩1/2</text><text x="506" y="238" text-anchor="middle">剩1/4</text><text x="759" y="281" text-anchor="middle">剩1/8</text></g>
    <rect x="890" y="20" width="120" height="280" rx="18" fill="#edd8d2" opacity=".72"/><text x="950" y="60" text-anchor="middle" fill="#914735" font-size="19" font-weight="700">可靠测量</text><text x="950" y="88" text-anchor="middle" fill="#914735" font-size="19" font-weight="700">逐渐困难</text>
  </g>
  <text x="600" y="626" text-anchor="middle" fill="#66736c" font-family="PingFang SC, sans-serif" font-size="22">恐龙时代以千万年计，远超这只“时钟”的工作范围</text>
</svg>
