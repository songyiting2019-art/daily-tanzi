<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">卫星追踪帝企鹅殖民地痕迹与迁移</title>
  <desc id="desc">三幅时间切片显示卫星从海冰上的深色粪迹识别殖民地，并看到迁移和返回。</desc>
  <rect width="800" height="480" rx="32" fill="#edf7fb"/>
  <text x="48" y="58" font-size="28" font-weight="700" fill="#12394a">卫星看见的是痕迹与位置</text>
  <g transform="translate(48 92)">
    <rect width="210" height="292" rx="22" fill="#fff" stroke="#9cc9d8" stroke-width="3"/>
    <text x="105" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#245269">较早影像</text>
    <path d="M20 88C70 58 144 64 190 90V244C136 222 75 232 20 254Z" fill="#d7eef5"/>
    <ellipse cx="95" cy="158" rx="43" ry="23" fill="#5b6770" opacity=".84"/>
    <circle cx="77" cy="143" r="4" fill="#1d252a"/><circle cx="104" cy="158" r="4" fill="#1d252a"/><circle cx="121" cy="168" r="4" fill="#1d252a"/>
    <text x="105" y="277" text-anchor="middle" font-size="15" fill="#4f6570">深色粪迹标出存在</text>
  </g>
  <g transform="translate(295 92)">
    <rect width="210" height="292" rx="22" fill="#fff" stroke="#9cc9d8" stroke-width="3"/>
    <text x="105" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#245269">海冰改变</text>
    <path d="M20 88C70 58 144 64 190 90L165 145 190 190V244C136 222 75 232 20 254L42 190 20 150Z" fill="#d7eef5"/>
    <path d="M103 78l-18 78 38 42-22 64" fill="none" stroke="#77b7cc" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="152" cy="182" rx="36" ry="20" fill="#5b6770" opacity=".84"/>
    <path d="M87 157C112 148 128 154 142 165" fill="none" stroke="#cf7d2d" stroke-width="5" stroke-dasharray="8 7"/>
    <path d="M137 154l10 13-16 3" fill="none" stroke="#cf7d2d" stroke-width="4"/>
    <text x="105" y="277" text-anchor="middle" font-size="15" fill="#4f6570">邻近地点出现新痕迹</text>
  </g>
  <g transform="translate(542 92)">
    <rect width="210" height="292" rx="22" fill="#fff" stroke="#9cc9d8" stroke-width="3"/>
    <text x="105" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#245269">后来影像</text>
    <path d="M20 88C70 58 144 64 190 90V244C136 222 75 232 20 254Z" fill="#d7eef5"/>
    <ellipse cx="96" cy="158" rx="41" ry="22" fill="#5b6770" opacity=".84"/>
    <path d="M151 183C132 173 119 166 110 158" fill="none" stroke="#4d8b5f" stroke-width="5" stroke-dasharray="8 7"/>
    <path d="M115 147l-10 10 14 6" fill="none" stroke="#4d8b5f" stroke-width="4"/>
    <text x="105" y="277" text-anchor="middle" font-size="15" fill="#4f6570">有些群体会返回</text>
  </g>
  <text x="400" y="438" text-anchor="middle" font-size="16" fill="#405d69">位置变化能显示行为弹性，但不等于逐只计数，也不消除海冰风险</text>
</svg>
