<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">检疫从三十天到四十天的时间线</title>
  <desc id="desc">1377年拉古萨规定三十天，后来欧洲港口逐渐采用四十天，形成quarantine一词。</desc>
  <rect width="960" height="560" rx="36" fill="#eef1ec"/>
  <text x="64" y="70" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2924">quarantine 的词里，保留着一段“40天”历史</text>
  <line x1="145" y1="244" x2="815" y2="244" stroke="#315f54" stroke-width="9" stroke-linecap="round"/>
  <circle cx="225" cy="244" r="22" fill="#c56e4f"/>
  <circle cx="480" cy="244" r="22" fill="#d8a347"/>
  <circle cx="735" cy="244" r="22" fill="#315f54"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="225" y="145" font-size="30" font-weight="700" fill="#c56e4f">1377</text>
    <text x="225" y="185" font-size="22" fill="#1d2924">拉古萨：30天</text>
    <text x="225" y="300" font-size="25" font-weight="700" fill="#c56e4f">trentino</text>
    <text x="480" y="145" font-size="30" font-weight="700" fill="#a06c16">后来</text>
    <text x="480" y="185" font-size="22" fill="#1d2924">部分港口延为40天</text>
    <text x="480" y="300" font-size="25" font-weight="700" fill="#a06c16">quaranta = 40</text>
    <text x="735" y="145" font-size="30" font-weight="700" fill="#315f54">今天</text>
    <text x="735" y="185" font-size="22" fill="#1d2924">期限随疾病证据而定</text>
    <text x="735" y="300" font-size="25" font-weight="700" fill="#315f54">不是固定40天</text>
  </g>
  <rect x="95" y="355" width="770" height="100" rx="20" fill="#fff" stroke="#d8d0c4" stroke-width="3"/>
  <text x="128" y="398" font-family="sans-serif" font-size="22" font-weight="700" fill="#1d2924">历史词源 ≠ 现代处方</text>
  <text x="128" y="432" font-family="sans-serif" font-size="21" fill="#5f665f">潜伏期、传播方式、暴露时间和检测能力共同决定实际措施。</text>
  <text x="64" y="520" font-family="sans-serif" font-size="18" fill="#6f756f">原创时间线 · 据美国疾控中心 Emerging Infectious Diseases 资料整理</text>
</svg>
