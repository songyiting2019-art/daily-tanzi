<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">女性系腰口袋结构示意</title>
  <desc id="desc">绳带将梨形口袋系在腰间，外裙开口让手伸入取物。</desc>
  <rect width="960" height="560" rx="36" fill="#f4efe6"/>
  <text x="70" y="72" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2924">口袋独立于裙装，藏在布层下面</text>
  <path d="M240 155 Q480 82 720 155 L800 474 Q480 535 160 474 Z" fill="#d9c7a2" stroke="#7b6847" stroke-width="5"/>
  <path d="M480 130 L480 494" stroke="#f4efe6" stroke-width="12" stroke-dasharray="12 14"/>
  <path d="M180 154 Q480 110 780 154" fill="none" stroke="#315f54" stroke-width="16"/>
  <path d="M368 175 Q480 132 592 175 L622 420 Q480 476 338 420 Z" fill="#c56e4f" stroke="#6f3b2e" stroke-width="5"/>
  <path d="M480 206 L480 353" stroke="#f7e8d3" stroke-width="12" stroke-linecap="round"/>
  <path d="M725 252 C646 250 590 270 530 320" fill="none" stroke="#315f54" stroke-width="18" stroke-linecap="round"/>
  <circle cx="726" cy="252" r="25" fill="#315f54"/>
  <text x="74" y="198" font-family="sans-serif" font-size="23" fill="#1d2924">腰带</text>
  <line x1="137" y1="191" x2="220" y2="162" stroke="#1d2924" stroke-width="3"/>
  <text x="75" y="394" font-family="sans-serif" font-size="23" fill="#1d2924">外裙与衬裙</text>
  <line x1="225" y1="387" x2="300" y2="354" stroke="#1d2924" stroke-width="3"/>
  <text x="660" y="370" font-family="sans-serif" font-size="23" fill="#1d2924">手从裙侧开口伸入</text>
  <line x1="675" y1="348" x2="580" y2="316" stroke="#1d2924" stroke-width="3"/>
  <text x="389" y="445" font-family="sans-serif" font-size="24" font-weight="700" fill="#f7e8d3">系腰口袋</text>
  <text x="70" y="525" font-family="sans-serif" font-size="20" fill="#7b6847">原创示意图 · 不按比例 · 据 V&amp;A 馆藏资料整理</text>
