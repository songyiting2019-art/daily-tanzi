<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc">
  <title id="title">2026年英仙座流星雨观测指南</title>
  <desc id="desc">新月减少月光干扰，中国观测者可在八月十三日天亮前寻找开阔暗天空，用肉眼等待流星。</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#132d43"/><stop offset="1" stop-color="#315b66"/></linearGradient></defs>
  <rect width="760" height="660" rx="34" fill="url(#sky)"/>
  <g fill="#fff4c7"><circle cx="102" cy="130" r="3"/><circle cx="186" cy="98" r="2"/><circle cx="294" cy="152" r="3"/><circle cx="450" cy="90" r="2"/><circle cx="624" cy="150" r="3"/><circle cx="690" cy="102" r="2"/></g>
  <path d="M178 214 L342 102" stroke="#f4cf70" stroke-width="7" stroke-linecap="round"/><path d="M190 206 L164 222" stroke="#f4cf70" stroke-width="3"/>
  <path d="M416 240 L604 126" stroke="#fff4c7" stroke-width="5" stroke-linecap="round"/><path d="M428 232 L402 248" stroke="#fff4c7" stroke-width="3"/>
  <text x="46" y="62" fill="#ffffff" font-family="PingFang SC, sans-serif" font-size="29" font-weight="700">今年少了一盏月光灯</text>
  <text x="46" y="94" fill="#c9dce2" font-family="PingFang SC, sans-serif" font-size="17">英仙座流星雨 · 8月12日晚至13日清晨附近</text>
  <rect x="46" y="296" width="668" height="116" rx="22" fill="#f4efe6" opacity="0.96"/>
  <text x="76" y="338" fill="#7b6847" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700">北京时间</text>
  <text x="76" y="378" fill="#173f35" font-family="PingFang SC, sans-serif" font-size="25" font-weight="700">优先看 8月13日天亮前</text>
  <text x="462" y="378" fill="#6f776f" font-family="PingFang SC, sans-serif" font-size="16">峰值前后几晚也可尝试</text>
  <g font-family="PingFang SC, sans-serif">
    <rect x="46" y="438" width="206" height="166" rx="22" fill="#dce8e1"/><text x="72" y="480" fill="#275b4d" font-size="19" font-weight="700">找暗处</text><text x="72" y="515" fill="#47675f" font-size="16">避开路灯</text><text x="72" y="542" fill="#47675f" font-size="16">先查云量</text><text x="72" y="569" fill="#47675f" font-size="16">保证场地安全</text>
    <rect x="277" y="438" width="206" height="166" rx="22" fill="#eee1be"/><text x="303" y="480" fill="#7b5b25" font-size="19" font-weight="700">等眼睛</text><text x="303" y="515" fill="#806b46" font-size="16">适应黑暗</text><text x="303" y="542" fill="#806b46" font-size="16">约20—30分钟</text><text x="303" y="569" fill="#806b46" font-size="16">手机屏幕调暗</text>
    <rect x="508" y="438" width="206" height="166" rx="22" fill="#dce8ee"/><text x="534" y="480" fill="#2e6e87" font-size="19" font-weight="700">看整片天</text><text x="534" y="515" fill="#55737e" font-size="16">肉眼即可</text><text x="534" y="542" fill="#55737e" font-size="16">不需要望远镜</text><text x="534" y="569" fill="#55737e" font-size="16">理想小时率非保证</text>
  </g>
</svg>
