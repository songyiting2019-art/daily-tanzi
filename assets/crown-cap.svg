<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">皇冠瓶盖剖面</title>
  <desc id="desc">金属盖的波纹裙边扣住玻璃瓶口凸缘，软垫压在瓶口上形成密封。</desc>
  <defs><linearGradient id="metal" x1="0" x2="1"><stop stop-color="#d8dee9"/><stop offset=".5" stop-color="#8793a4"/><stop offset="1" stop-color="#eef2f7"/></linearGradient><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#6ee7b7" stop-opacity=".35"/><stop offset=".5" stop-color="#d1fae5" stop-opacity=".75"/><stop offset="1" stop-color="#34d399" stop-opacity=".28"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs>
  <rect width="1200" height="720" rx="34" fill="#f5f2ea"/>
  <path d="M410 650V390Q410 320 480 320H720Q790 320 790 390V650" fill="url(#glass)" stroke="#0f766e" stroke-width="7"/>
  <path d="M385 420Q405 450 455 450H745Q795 450 815 420" fill="none" stroke="#0f766e" stroke-width="20"/>
  <path d="M350 176H850L830 255L852 282L824 315L846 348L818 382L840 420Q790 394 775 326H425Q410 394 360 420L382 382L354 348L376 315L348 282L370 255Z" fill="url(#metal)" stroke="#334155" stroke-width="7"/>
  <rect x="402" y="272" width="396" height="66" rx="28" fill="#b45309" stroke="#78350f" stroke-width="6"/>
  <path d="M885 220H1035" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><text x="875" y="208" fill="#134e4a" font-size="30" text-anchor="end" font-family="sans-serif">金属盖</text>
  <path d="M850 308H1035" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><text x="840" y="296" fill="#134e4a" font-size="30" text-anchor="end" font-family="sans-serif">密封垫</text>
  <path d="M845 390H1035" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><text x="835" y="378" fill="#134e4a" font-size="30" text-anchor="end" font-family="sans-serif">波纹裙边</text>
  <path d="M355 445H165" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><text x="365" y="488" fill="#134e4a" font-size="30" font-family="sans-serif">瓶口凸缘</text>
  <text x="600" y="92" text-anchor="middle" fill="#1f2937" font-size="42" font-weight="700" font-family="sans-serif">夹紧与密封分工</text>
