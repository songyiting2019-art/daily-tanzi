<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">飞行记录器结构与功能</title>
  <desc id="desc">橙色外壳内有隔热层和抗撞击存储模块，外侧连接水下定位信标。</desc>
  <rect width="1200" height="720" rx="42" fill="#f4efe6"/>
  <text x="80" y="92" font-family="sans-serif" font-size="40" font-weight="700" fill="#1d2924">醒目外壳帮助寻找，存储核心负责留下数据</text>
  <rect x="100" y="170" width="730" height="410" rx="55" fill="#e76f2e" stroke="#1d2924" stroke-width="10"/>
  <rect x="180" y="245" width="570" height="260" rx="40" fill="#f5d9a9" stroke="#6b5739" stroke-width="9"/>
  <rect x="285" y="305" width="360" height="140" rx="28" fill="#dce8e1" stroke="#1d2924" stroke-width="9"/>
  <g fill="#1d2924"><circle cx="365" cy="375" r="25"/><circle cx="465" cy="375" r="25"/><circle cx="565" cy="375" r="25"/></g>
  <rect x="865" y="230" width="220" height="290" rx="105" fill="#f0c548" stroke="#1d2924" stroke-width="10"/>
  <path d="M900 375 q75 -95 150 0 q-75 95 -150 0" fill="none" stroke="#3b7080" stroke-width="16"/>
  <path d="M820 375 H865" stroke="#1d2924" stroke-width="16"/>
  <text x="120" y="635" font-family="sans-serif" font-size="29" fill="#e76f2e">橙色外壳</text>
  <text x="335" y="635" font-family="sans-serif" font-size="29" fill="#6b5739">隔热与缓冲</text>
  <text x="585" y="635" font-family="sans-serif" font-size="29" fill="#1d2924">存储模块</text>
  <text x="850" y="635" font-family="sans-serif" font-size="29" fill="#3b7080">水下定位信标</text>
</svg>
