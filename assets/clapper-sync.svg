<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">场记板把画面中的合板瞬间与录音尖峰对齐示意</title>
  <desc id="desc">上方是连续画格，中央画格记录场记板合拢；下方是音频波形，在同一时刻出现清晰尖峰。板面还记录场次和镜次。</desc>
  <rect width="960" height="540" rx="34" fill="#f4efe6"/>
  <text x="68" y="68" font-family="sans-serif" font-size="28" font-weight="700" fill="#1d2924">“啪”声把两条时间线钉在一起</text>
  <text x="68" y="106" font-family="sans-serif" font-size="18" fill="#6d604d">摄影机看见合板，录音机听见尖峰</text>
  <g transform="translate(70 145)">
    <text x="0" y="25" font-family="sans-serif" font-size="18" font-weight="700" fill="#1d2924">画面</text>
    <rect x="85" y="0" width="190" height="130" rx="14" fill="#dce8e1" stroke="#9cab9e"/>
    <rect x="300" y="0" width="190" height="130" rx="14" fill="#eee1be" stroke="#b98a49" stroke-width="4"/>
    <rect x="515" y="0" width="190" height="130" rx="14" fill="#dce8e1" stroke="#9cab9e"/>
    <g fill="#1d2924" font-family="sans-serif" text-anchor="middle">
      <text x="180" y="72" font-size="20">板口将合</text><text x="395" y="60" font-size="22" font-weight="700">合板一帧</text><text x="395" y="91" font-size="16">场 23 · 镜 4</text><text x="610" y="72" font-size="20">板口已合</text>
    </g>
    <path d="M395 130 V276" stroke="#b98a49" stroke-width="4" stroke-dasharray="8 8"/>
    <text x="0" y="227" font-family="sans-serif" font-size="18" font-weight="700" fill="#1d2924">声音</text>
    <path d="M85 220 L125 216 L165 226 L205 218 L245 224 L285 220 L325 226 L365 214 L385 223 L395 155 L405 285 L415 216 L455 225 L495 217 L535 224 L575 218 L615 224 L655 218 L705 222" fill="none" stroke="#526f80" stroke-width="5" stroke-linejoin="round"/>
    <text x="425" y="310" font-family="sans-serif" font-size="18" fill="#1d2924">波形尖峰 = 对齐点</text>
  </g>
  <text x="68" y="498" font-family="sans-serif" font-size="16" fill="#7b6847">原创示意 · 剪辑时可用合板画格与声音尖峰校准同步</text>
</svg>
