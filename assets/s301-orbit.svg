<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">S301围绕人马座A星的轨道示意</title>
  <desc id="desc">一条高偏心率椭圆轨道围绕黑洞，恒星在近心点速度最高。</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%"><stop offset="0" stop-color="#172543"/><stop offset="1" stop-color="#07101f"/></radialGradient>
    <radialGradient id="hole"><stop offset="0" stop-color="#000"/><stop offset="0.68" stop-color="#02040a"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".85"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <g fill="#fff" opacity=".62"><circle cx="91" cy="90" r="2"/><circle cx="220" cy="604" r="2.4"/><circle cx="351" cy="121" r="1.8"/><circle cx="1048" cy="120" r="2.2"/><circle cx="1110" cy="560" r="1.7"/><circle cx="770" cy="82" r="1.5"/><circle cx="620" cy="650" r="2"/></g>
  <ellipse cx="607" cy="360" rx="474" ry="166" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-dasharray="12 12" transform="rotate(-12 607 360)"/>
  <path d="M185 445C384 616 885 581 1056 357" fill="none" stroke="#7dd3fc" stroke-width="7" marker-end="url(#arrow)" opacity=".88"/>
  <circle cx="1010" cy="337" r="66" fill="url(#hole)" filter="url(#glow)"/>
  <circle cx="870" cy="230" r="16" fill="#f8fafc" filter="url(#glow)"/>
  <path d="M875 226L967 303" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1020" y="430" fill="#f8fafc" font-size="32" font-family="sans-serif" text-anchor="middle">人马座 A*</text>
  <text x="815" y="190" fill="#f8fafc" font-size="34" font-family="sans-serif">S301</text>
  <text x="692" y="534" fill="#bae6fd" font-size="28" font-family="sans-serif">轨道周期 8.7 年</text>
  <text x="710" y="574" fill="#bae6fd" font-size="28" font-family="sans-serif">近心点速度约 25,000 km/s</text>
</svg>
